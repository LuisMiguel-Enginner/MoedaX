<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="imagens/logo-moedax.svg" />
  <meta name="description" content="Faça login na MoedaX — compare e monitore cotações de moedas e criptomoedas." />
  <title>MoedaX | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { mountMoedaxLogos } from './javascript/moedax-logo.js';
    mountMoedaxLogos();
  </script>
  <script type="module" src="javascript/login.js"></script>
</head>
<body class="auth-page auth-page--login">
  <header class="auth-header auth-header--login">
    <a class="auth-brand auth-brand-center" href="login.html">
      <span class="logo-slot" data-moedax-logo data-logo-title="MoedaX"></span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <section class="auth-info auth-info--login" aria-label="Sobre a MoedaX">
        <div class="auth-info__copy">
          <span class="logo-slot logo-slot--panel" data-moedax-logo="decorative"></span>
          <h1>Compare, analise, invista</h1>
          <p class="auth-lead">Acompanhe cotações, compare moedas e tome decisões mais inteligentes para o seu futuro financeiro.</p>
        </div>
        <div class="auth-info__visual">
          <img src="imagens/login-ilustracao-moedas.png" alt="" class="auth-coins-art" width="383" height="170" />
        </div>
      </section>

      <section class="auth-panel-form" aria-labelledby="loginTitle">
        <div class="auth-form-block">
          <h2 id="loginTitle">Bem-vindo de volta!</h2>
          <p class="auth-subtitle">Faça login para continuar</p>

          <div id="authMessage" class="auth-message error" hidden role="alert"></div>

          <form id="loginForm" class="auth-form" novalidate>
            <div class="field">
              <i data-lucide="mail" class="field-icon" aria-hidden="true"></i>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="E-mail" required />
            </div>
            <div class="field">
              <i data-lucide="lock" class="field-icon" aria-hidden="true"></i>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Senha" required minlength="6" />
            </div>

            <div class="form-row">
              <label class="checkbox-label">
                <input id="remember" name="remember" type="checkbox" />
                <span class="checkbox-custom" aria-hidden="true"></span>
                Lembrar de mim
              </label>
              <a id="forgotPassword" class="forgot-link" href="#">Esqueceu sua senha?</a>
            </div>

            <button id="loginSubmit" class="btn-primary" type="submit">
              <span>Entrar</span>
              <span class="btn-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
            </button>
          </form>

          <div class="divider">ou</div>

          <button id="googleLogin" class="btn-google" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Entrar com Google
          </button>

          <p class="auth-footer-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
