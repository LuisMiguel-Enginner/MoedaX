<header class="auth-header auth-header--login">
  <a class="auth-brand auth-brand-center" routerLink="/login" aria-label="MoedaX">
    <img class="logo-img" src="/imagens/logo-moedax.svg" alt="MoedaX" width="203" height="42" />
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <section class="auth-info auth-info--login" aria-label="Sobre a MoedaX">
      <div class="auth-info__copy">
        <img class="logo-img logo-img--panel" src="/imagens/logo-moedax.svg" alt="" aria-hidden="true" width="193" height="40" />
        <h1>Compare, analise, invista</h1>
        <p class="auth-lead">Acompanhe cotações, compare moedas e tome decisões mais inteligentes para o seu futuro financeiro.</p>
      </div>
      <div class="auth-info__visual">
        <img src="/imagens/login-ilustracao-moedas.png" alt="" class="auth-coins-art" width="383" height="170" />
      </div>
    </section>

    <section class="auth-panel-form" aria-labelledby="loginTitle">
      <div class="auth-form-block">
        <h2 id="loginTitle">Bem-vindo de volta!</h2>
        <p class="auth-subtitle">Faça login para continuar</p>

        <div *ngIf="message" class="auth-message" [class.error]="messageType === 'error'" [class.success]="messageType === 'success'" role="alert">
          {{ message }}
        </div>

        <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="E-mail" formControlName="email" />
          </div>
          <small *ngIf="emailInvalid" class="field-error" role="alert">Informe um e-mail válido.</small>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 1 1 8 0v3"></path></svg>
            <input id="password" name="password" [type]="passwordVisible ? 'text' : 'password'" autocomplete="current-password" placeholder="Senha" formControlName="password" />
            <button type="button" class="field-toggle" (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <small *ngIf="passwordInvalid" class="field-error" role="alert">Informe sua senha.</small>

          <div class="form-row">
            <label class="checkbox-label">
              <input id="remember" name="remember" type="checkbox" formControlName="remember" />
              <span class="checkbox-custom" aria-hidden="true"></span>
              Lembrar de mim
            </label>
            <a class="forgot-link" href="#" (click)="$event.preventDefault(); resetPassword()">Esqueceu sua senha?</a>
          </div>

          <button class="btn-primary" type="submit" [disabled]="loading">
            <span>{{ loading ? 'Entrando...' : 'Entrar' }}</span>
            <span class="btn-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </span>
          </button>
        </form>

        <div class="divider">ou</div>

        <button class="btn-google" type="button" (click)="signInWithGoogle()" [disabled]="loading">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Entrar com Google
        </button>

        <p class="auth-footer-text">Não tem uma conta? <a routerLink="/cadastro">Cadastre-se</a></p>
      </div>
    </section>
  </div>
</main>
