<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ title }}</mat-card-title>
    <mat-card-subtitle>Rota Angular configurada</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>Esta tela é um espaço inicial para a futura migração da funcionalidade de {{ title.toLowerCase() }}.</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button routerLink="/">Voltar à visão geral</a>
  </mat-card-actions>
</mat-card>
